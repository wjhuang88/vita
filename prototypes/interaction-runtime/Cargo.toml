[package]
name = "vita-interaction-prototype"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1.92"
serde_json = "1.0.151"
vita-system-facts = { path = "../../crates/vita-system-facts" }
talos-runtime = { git = "https://github.com/wjhuang88/talos.git", rev = "261602242e49e6f921f5d3e4eac96eebbe92f8b3" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }

[features]
model-test = ["dep:talos-provider", "dep:talos-config", "dep:serde", "dep:url"]

[dependencies.talos-provider]
git = "https://github.com/wjhuang88/talos.git"
rev = "261602242e49e6f921f5d3e4eac96eebbe92f8b3"
optional = true

[dependencies.talos-config]
git = "https://github.com/wjhuang88/talos.git"
rev = "261602242e49e6f921f5d3e4eac96eebbe92f8b3"
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.url]
version = "2"
optional = true
