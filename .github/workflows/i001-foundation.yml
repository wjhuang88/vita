name: I001 Foundation

on:
  pull_request:
    paths:
      - ".github/workflows/i001-foundation.yml"
      - "prototypes/interaction-runtime/**"
      - "crates/vita-system-facts/**"
      - "prototypes/boot/**"
      - "scripts/ci/validate_i001_boot.sh"
      - "docs/reference/TALOS-INTEGRATION.md"
      - "docs/reference/BOOT-STRATEGY-RESEARCH.md"
      - "docs/backlog/active/VITA-001-D-talos-interaction-runtime.md"
      - "scripts/validate_project_governance.sh"
      - ".agent-governance/manifest.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate governance
        run: sh scripts/validate_project_governance.sh .

  talos-runtime-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Test Rust-native Vita system facts
        run: cargo +1.99.0 test --manifest-path crates/vita-system-facts/Cargo.toml
      - name: Test Vita console parser and event rendering
        run: cargo +1.99.0 test --manifest-path prototypes/interaction-runtime/Cargo.toml
      - name: Run Vita Talos embedding prototype
        working-directory: prototypes/interaction-runtime
        run: cargo +1.99.0 run
      - name: Exercise multi-turn console and provider error recovery
        working-directory: prototypes/interaction-runtime
        run: |
          printf 'inspect\ndemo:error\ninspect again\n:quit\n' | cargo +1.99.0 run -- --console-fixture | tee /tmp/vita-console.log
          grep -Fq 'VITA_CONSOLE_EXIT_OK' /tmp/vita-console.log
          test "$(grep -Fc '[turn:ok]' /tmp/vita-console.log)" -eq 2
          grep -Fq '[turn:error]' /tmp/vita-console.log
          grep -Fq '[tool] system_summary' /tmp/vita-console.log

  boot-chain-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate disposable-image Ventoy to Vita boot chain
        run: scripts/ci/validate_i001_boot.sh
